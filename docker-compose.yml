services:
  connect:
    image: ghcr.io/ylianst/meshcentral:1.2.5
    container_name: connect
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./meshcentral/data:/opt/meshcentral/meshcentral-data
      - ./meshcentral/files:/opt/meshcentral/meshcentral-files
      - ./meshcentral/backup:/opt/meshcentral/meshcentral-backups
      - ./meshcentral/web:/opt/meshcentral/meshcentral-web
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"require('https').get({host:'127.0.0.1',port:443,rejectUnauthorized:false},r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    security_opt:
      - no-new-privileges:true
